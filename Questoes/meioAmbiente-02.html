<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AprovaDrive | Meio Ambiente - Bateria 02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #7c3aed;
  --primary-hover: #6d28d9;
  --primary-soft: #f3e8ff;
  --brand-green: #16a34a;
  --brand-green-soft: #f0fdf4;
  --brand-red: #ef4444;
  --brand-red-soft: #fef2f2;
  --text-dark: #0f172a;
  --text-body: #334155;
  --text-muted: #64748b;
  --bg-page: #f8fafc;
  --bg-card: #ffffff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 16px 40px rgba(124, 58, 237, 0.08);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text-body);
  background: radial-gradient(circle at 10% 10%, #f3e8ff 0%, transparent 40%),
              radial-gradient(circle at 90% 20%, #e0f2fe 0%, transparent 40%),
              var(--bg-page);
  min-height: 100vh;
  line-height: 1.5;
  padding: 24px 16px 60px;
}
.app-container {
  max-width: 860px;
  margin: 0 auto;
}
.topo-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.marca-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: #0752a0;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.5px;
}
.marca-link i {
  color: #16a34a;
}
.btn-voltar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-card);
  color: var(--text-body);
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  padding: 9px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.btn-voltar:hover {
  background: #f1f5f9;
  border-color: var(--border-strong);
  color: var(--text-dark);
  transform: translateX(-2px);
}
.hero-card {
  padding: 30px;
  border-radius: 24px;
  background: linear-gradient(135deg, #064e3b 0%, #0f766e 50%, #08634d 100%);
  color: #ffffff;
  box-shadow: 0 12px 30px rgba(6, 78, 59, 0.2);
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.hero-card::after {
  content: "";
  position: absolute;
  right: -30px;
  top: -30px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 70%);
  pointer-events: none;
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.25);
  padding: 4px 12px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hero-card h1 {
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 8px;
}
.hero-card p {
  color: #d1fae5;
  font-size: 14px;
  max-width: 600px;
}
.card-quiz {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(10px);
}
.placar-topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.pill-info {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #f8fafc;
  border: 1px solid var(--border);
  padding: 5px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}
.pill-xp {
  color: var(--primary);
  background: var(--primary-soft);
  border-color: #ddd6fe;
}
.barra-wrap {
  width: 100%;
  height: 8px;
  background: #e2e8f0;
  border-radius: 99px;
  overflow: hidden;
  margin: 14px 0 24px;
}
.barra-fill {
  height: 100%;
  background: linear-gradient(90deg, #10b981, #059669);
  border-radius: inherit;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.tag-modulo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #ecfdf5;
  color: #065f46;
  border: 1px solid #a7f3d0;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.pergunta-titulo {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-dark);
  line-height: 1.4;
  margin-bottom: 24px;
}
.opcoes-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.opcao-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  background: #ffffff;
  border: 2px solid var(--border);
  border-radius: 14px;
  font-family: inherit;
  font-size: 14px;
  color: var(--text-dark);
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
}
.opcao-btn:hover:not(:disabled) {
  border-color: #10b981;
  background: #f0fdf4;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.08);
}
.opcao-btn:disabled {
  cursor: default;
}
.letra-chip {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 8px;
  background: #f1f5f9;
  color: #475569;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  transition: all 0.2s ease;
}
.opcao-btn:hover:not(:disabled) .letra-chip {
  background: #10b981;
  color: #ffffff;
}
.opcao-texto {
  flex: 1;
  font-weight: 600;
  line-height: 1.4;
}
.opcao-icon {
  font-size: 16px;
  opacity: 0;
  transform: scale(0.7);
  transition: all 0.2s ease;
}
.opcao-btn.certa {
  border-color: var(--brand-green) !important;
  background: var(--brand-green-soft) !important;
  color: #14532d !important;
}
.opcao-btn.certa .letra-chip {
  background: var(--brand-green) !important;
  color: #ffffff !important;
}
.opcao-btn.certa .opcao-icon {
  opacity: 1;
  transform: scale(1);
  color: var(--brand-green);
}
.opcao-btn.errada {
  border-color: var(--brand-red) !important;
  background: var(--brand-red-soft) !important;
  color: #7f1d1d !important;
}
.opcao-btn.errada .letra-chip {
  background: var(--brand-red) !important;
  color: #ffffff !important;
}
.opcao-btn.errada .opcao-icon {
  opacity: 1;
  transform: scale(1);
  color: var(--brand-red);
}
.feedback-box {
  margin-top: 20px;
  padding: 16px 20px;
  border-radius: 14px;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.feedback-box.certo {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-left: 4px solid var(--brand-green);
  color: #14532d;
}
.feedback-box.errado {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-left: 4px solid var(--brand-red);
  color: #7f1d1d;
}
.feedback-title {
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.feedback-desc {
  font-size: 13px;
  line-height: 1.45;
}
.rodape-acoes {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid #f1f5f9;
}
.btn-acao {
  padding: 12px 22px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
  border: none;
}
.btn-secundario {
  background: #f8fafc;
  border: 1px solid var(--border-strong);
  color: var(--text-body);
}
.btn-secundario:hover:not(:disabled) {
  background: #f1f5f9;
}
.btn-secundario:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-primario {
  background: #0f766e;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
}
.btn-primario:hover:not(:disabled) {
  background: #115e59;
  transform: translateY(-1px);
}
.btn-primario:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
}
.resultado-wrap {
  text-align: center;
  padding: 20px 10px;
}
.trofeu-circulo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
}
.trofeu-circulo.aprovado {
  background: #f0fdf4;
  color: var(--brand-green);
  border: 3px solid #bbf7d0;
}
.trofeu-circulo.reprovado {
  background: #fff7ed;
  color: #f59e0b;
  border: 3px solid #fde68a;
}
.resultado-titulo {
  font-size: 24px;
  font-weight: 800;
  color: var(--text-dark);
  margin-bottom: 8px;
}
.resultado-sub {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 24px;
}
.resultado-metricas {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.metrica-card {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
}
.metrica-card strong {
  display: block;
  font-size: 22px;
  font-weight: 800;
  color: var(--text-dark);
}
.metrica-card span {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
}
.xp-tag-resultado {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  color: #065f46;
  padding: 8px 18px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 28px;
}
.resultado-botoes-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn-resultado-link {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  text-decoration: none;
  font-size: 14px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="app-container">
  <nav class="topo-nav">
    <a href="../src/pages/telaInicial.html#questoes" class="marca-link">
      <i class="fa-solid fa-car-side"></i> AprovaDrive
    </a>
    <a href="../src/pages/telaInicial.html#questoes" class="btn-voltar">
      <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
    </a>
  </nav>

  <header class="hero-card">
    <span class="hero-tag"><i class="fa-solid fa-leaf"></i> Meio Ambiente · Bateria 02</span>
    <h1>Manutenção, Consumo e Resíduos</h1>
    <p>10 questões simuladas referentes aos Módulos 03 a 06 nos padrões da prova do DETRAN.</p>
  </header>

  <main class="card-quiz" id="quiz-conteudo" aria-live="polite"></main>
</div>

<script>
const LETRAS = ["A", "B", "C", "D"];
const API_URL = "http://localhost:3001";
const MATERIA = "MeioAmbiente";
const BATERIA = 2;

const perguntas = [
  {
    modulo: 3,
    texto: "Poluição sonora é:",
    opcoes: [
      "Qualquer som de veículo.",
      "Excesso de sons indesejados no ambiente.",
      "Apenas música alta.",
      "Somente barulho de obras."
    ],
    correta: 1,

    explicacao: "O excesso de ruído também afeta a qualidade de vida."
  },
  {

    opcoes: [

      "Apenas o vento.",
      "Motores, escapamentos, buzinas e trânsito intenso.",
      "Somente placas."
    ],
    correta: 2,
    corretaLetra: "C",
    explicacao: "Diferentes fontes de ruído se somam nas cidades."
  },
  {
    modulo: 3,
    texto: "Quem pode ser afetado por ruídos frequentes?",
    opcoes: [
      "Pessoas e animais.",
      "Somente motoristas.",
      "Apenas passageiros.",
      "Ninguém fora do veículo."
    ],
    correta: 0,
    corretaLetra: "A",
    explicacao: "Ruídos podem prejudicar descanso, conversa e concentração."
  },
  {
    modulo: 4,
    texto: "A manutenção preventiva contribui com o ambiente porque:",
    opcoes: [
      "Elimina toda emissão.",
      "Ajuda a evitar falhas, desperdícios e vazamentos.",
      "Dispensa o descarte correto.",
      "Transforma combustível sem perdas."
    ],
    correta: 1,
    corretaLetra: "B",
    explicacao: "Conservar o veículo pode evitar impactos adicionais."
  },
  {
    modulo: 4,
    texto: "Pneus mal calibrados podem causar:",
    opcoes: [
      "Maior resistência ao movimento e possível aumento no consumo.",
      "Emissão zero.",
      "Frenagem sempre melhor.",
      "Fim dos ruídos."
    ],
    correta: 0,
    corretaLetra: "A",
    explicacao: "Siga a calibragem indicada para o veículo."
  },
  {
    modulo: 4,
    texto: "Problemas no escapamento podem causar:",
    opcoes: [
      "Mudança na pintura.",
      "Mais passageiros.",
      "Emissões inadequadas ou ruído excessivo.",
      "Redução certa no consumo."
    ],
    correta: 2,
    corretaLetra: "C",
    explicacao: "Defeitos no sistema devem ser avaliados por uma oficina."
  },
  {
    modulo: 5,
    texto: "Em veículos a combustão, maior consumo geralmente está associado a:",
    opcoes: [
      "Mais emissões durante o uso.",
      "Somente vapor de água.",
      "Nenhum impacto.",
      "Fim da manutenção."
    ],
    correta: 0,
    corretaLetra: "A",
    explicacao: "O uso de combustível gera emissões."
  },
  {
    modulo: 5,
    texto: "Qual condução evita desperdício?",
    opcoes: [
      "Acelerar forte e frear logo depois.",
      "Deixar o motor ligado sem necessidade.",
      "Antecipar o trânsito e conduzir suavemente.",
      "Dirigir acima da velocidade adequada."
    ],
    correta: 2,
    corretaLetra: "C",
    explicacao: "Acelerações e frenagens desnecessárias gastam energia."
  },
  {
    modulo: 6,
    texto: "Qual conjunto contém resíduos automotivos?",
    opcoes: [
      "Somente papel.",
      "Apenas água limpa.",
      "Óleo usado, filtros, pneus e baterias.",
      "Somente combustível novo."
    ],
    correta: 2,
    corretaLetra: "C",
    explicacao: "Manutenção e reparos geram materiais que precisam de destinação adequada."
  },
  {
    modulo: 6,
    texto: "O que é logística reversa?",
    opcoes: [
      "Jogar tudo no lixo comum.",
      "Recolher certos produtos usados para destinação adequada.",
      "Guardar peças para sempre.",
      "Transportar resíduos pela contramão."
    ],
    correta: 1,
    corretaLetra: "B",
    explicacao: "Ela organiza o retorno de alguns materiais após o uso."
  }
];

let atual = 0;
let respostas = Array(perguntas.length).fill(null);
let acertos = 0;
let xpGanho = 0;

function obterUserId() {
  try {
    return localStorage.getItem("aprovadrive_user_id") ||
           localStorage.getItem("userId") ||
           "henrique";
  } catch {
    return "henrique";
  }
}

function salvarXpLocal(xpExtra) {
  try {
    const atualExp = Number(localStorage.getItem("aprovadrive_user_exp") || localStorage.getItem("exp") || 0);
    const novo = atualExp + xpExtra;
    localStorage.setItem("aprovadrive_user_exp", String(novo));
    localStorage.setItem("exp", String(novo));
  } catch {}
}

const quizEl = document.querySelector("#quiz-conteudo");

function renderizar() {
  if (atual >= perguntas.length) {
    renderizarResultado();
    return;
  }

  const p = perguntas[atual];
  const salva = respostas[atual];
  const respondida = salva !== null;
  const respondidasTotal = respostas.filter(r => r !== null).length;
  const pct = Math.round((respondidasTotal / perguntas.length) * 100);

  quizEl.innerHTML = `
    <div class="placar-topo">
      <span class="pill-info"><i class="fa-solid fa-list-check"></i> Questão ${atual + 1} de ${perguntas.length}</span>
      <span class="pill-info"><i class="fa-solid fa-circle-check"></i> Acertos: ${acertos}/${perguntas.length}</span>
      <span class="pill-info pill-xp"><i class="fa-solid fa-bolt"></i> +${xpGanho} XP</span>
    </div>

    <div class="barra-wrap">
      <div class="barra-fill" style="width: ${pct}%"></div>
    </div>

    <span class="tag-modulo"><i class="fa-solid fa-book-open"></i> Módulo ${p.modulo}</span>
    <h2 class="pergunta-titulo">${p.texto}</h2>

    <div class="opcoes-grid">
      ${p.opcoes.map((opcao, i) => {
        let classe = "opcao-btn";
        let icone = '<i class="fa-solid fa-circle-check opcao-icon"></i>';
        if (respondida) {
          if (i === p.correta) {
            classe += " certa";
            icone = '<i class="fa-solid fa-circle-check opcao-icon"></i>';
          } else if (i === salva.escolhida) {
            classe += " errada";
            icone = '<i class="fa-solid fa-circle-xmark opcao-icon"></i>';
          }
        }
        return `
          <button type="button" class="${classe}" data-i="${i}" ${respondida ? "disabled" : ""}>
            <span class="letra-chip">${LETRAS[i]}</span>
            <span class="opcao-texto">${opcao}</span>
            ${icone}
          </button>
        `;
      }).join("")}
    </div>

    ${respondida ? `
      <div class="feedback-box ${salva.correto ? "certo" : "errado"}">
        <div class="feedback-title">
          <i class="fa-solid ${salva.correto ? "fa-circle-check" : "fa-circle-xmark"}"></i>
          ${salva.correto ? "Parabéns! Resposta correta (+10 XP)" : `Resposta incorreta! Alternativa certa: Letra ${p.corretaLetra}`}
        </div>
        <div class="feedback-desc">${p.explicacao}</div>
      </div>
    ` : ""}

    <div class="rodape-acoes">
      <button type="button" class="btn-acao btn-secundario" id="btn-ant" ${atual === 0 ? "disabled" : ""}>
        <i class="fa-solid fa-arrow-left"></i> Anterior
      </button>
      <button type="button" class="btn-acao btn-primario" id="btn-prox" ${!respondida ? "disabled" : ""}>
        ${atual === perguntas.length - 1 ? "Ver Resultado" : "Próxima"} <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  `;

  quizEl.querySelectorAll("[data-i]").forEach(btn => {
    btn.onclick = async () => {
      const idx = Number(btn.dataset.i);
      await responder(idx);
    };
  });

  const btnAnt = document.querySelector("#btn-ant");
  if (btnAnt) {
    btnAnt.onclick = () => {
      if (atual > 0) {
        atual--;
        renderizar();
      }
    };
  }

  const btnProx = document.querySelector("#btn-prox");
  if (btnProx) {
    btnProx.onclick = () => {
      atual++;
      renderizar();
    };
  }
}

async function responder(idx) {
  if (respostas[atual] !== null) return;

  const p = perguntas[atual];
  const letra = LETRAS[idx];
  const userId = obterUserId();
  let correto = idx === p.correta;

  try {
    const res = await fetch(`${API_URL}/questoes/checkAcerto`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-User-Id": userId
      },
      body: JSON.stringify({
        materia: MATERIA,
        bateria: BATERIA,
        num: atual + 1,
        resposta: letra,
        userId: userId
      })
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.correto !== undefined) {
        correto = Boolean(data.correto);
      }
    }
  } catch {}

  if (correto) {
    acertos++;
    xpGanho += 10;
    salvarXpLocal(10);
  }

  respostas[atual] = {
    escolhida: idx,
    letra: letra,
    correto: correto
  };

  renderizar();
}

async function renderizarResultado() {
  const total = perguntas.length;
  const pct = Math.round((acertos / total) * 100);
  const aprovado = pct >= 70;

  let proximaLiberada = false;
  try {
    const resConcluir = await fetch(`${API_URL}/questoes/concluirBateria`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-User-Id": obterUserId()
      },
      body: JSON.stringify({
        materia: MATERIA,
        bateria: BATERIA,
        acertos: acertos,
        total: total,
        userId: obterUserId()
      })
    });
    if (resConcluir.ok) {
      const dataConcluir = await resConcluir.json();
      if (dataConcluir && typeof dataConcluir.proximaBateriaLiberada === "boolean") {
        proximaLiberada = dataConcluir.proximaBateriaLiberada;
      }
    }
  } catch {}

  if (!proximaLiberada) {
    try {
      const resAcesso = await fetch(`${API_URL}/questoes/verificarAcesso?materia=${MATERIA}&bateria=3&userId=${obterUserId()}`);
      if (resAcesso.ok) {
        const dataAcesso = await resAcesso.json();
        if (dataAcesso && typeof dataAcesso.permitido === "boolean") {
          proximaLiberada = dataAcesso.permitido;
        }
      }
    } catch {}
  }

  quizEl.innerHTML = `
    <div class="resultado-wrap">
      <div class="trofeu-circulo ${aprovado ? "aprovado" : "reprovado"}">
        <i class="fa-solid ${aprovado ? "fa-trophy" : "fa-graduation-cap"}"></i>
      </div>

      <h2 class="resultado-titulo">${aprovado ? "Excelente Desempenho!" : "Bom Treinamento!"}</h2>
      <p class="resultado-sub">${aprovado ? "Você concluiu a Bateria 02 com aproveitamento exemplar." : "Revise os módulos 03 a 06 e tente novamente para melhorar seus acertos."}</p>

      <div class="resultado-metricas">
        <div class="metrica-card">
          <strong>${total}</strong>
          <span>Total Questões</span>
        </div>
        <div class="metrica-card">
          <strong style="color: ${aprovado ? "#16a34a" : "#d97706"};">${acertos}</strong>
          <span>Acertos</span>
        </div>
        <div class="metrica-card">
          <strong style="color: ${aprovado ? "#16a34a" : "#d97706"};">${pct}%</strong>
          <span>Aproveitamento</span>
        </div>
      </div>

      <div class="xp-tag-resultado">
        <i class="fa-solid fa-bolt"></i> +${xpGanho} XP conquistados nesta bateria
      </div>

      <div class="resultado-botoes-grid">
        ${proximaLiberada ? `
        <a href="meioAmbiente-03.html" class="btn-resultado-link btn-primario" id="btn-proxima-bateria">
          <i class="fa-solid fa-forward"></i> Ir para Bateria 03
        </a>
        ` : ""}
        <button type="button" class="btn-resultado-link ${proximaLiberada ? "btn-secundario" : "btn-primario"}" id="btn-refazer">
          <i class="fa-solid fa-rotate-left"></i> Refazer Bateria 02
        </button>
        <a href="../src/pages/telaInicial.html#questoes" class="btn-resultado-link btn-secundario">
          <i class="fa-solid fa-layer-group"></i> Voltar ao Painel Geral
        </a>
      </div>
    </div>
  `;

  document.querySelector("#btn-refazer").onclick = () => {
    atual = 0;
    respostas = Array(perguntas.length).fill(null);
    acertos = 0;
    xpGanho = 0;
    renderizar();
  };
}

renderizar();
</script>
</body>
</html>

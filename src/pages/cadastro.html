<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprovaDrive - Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/styleCadastro.css">
</head>
<body>
    <div class="card">
        <div class="logo">
            <span class="logo-a">A</span><span class="logo-aprova">prova</span><span class="logo-drive">Drive</span>
        </div>

        <h1>Crie sua conta</h1>
        <p class="subtitle">Preencha os dados abaixo para se cadastrar</p>

        <form id="formCadastro">
            <div class="campo">
                <span class="icone"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="nome" placeholder="Nome completo" required>
            </div>

            <div class="campo">
                <span class="icone"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" id="email" placeholder="E-mail" required>
            </div>

            <div class="campo">
                <span class="icone"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="senhaCadastro" placeholder="Senha (mínimo 6 caracteres)" required>
            </div>

            <div class="campo">
                <span class="icone"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="confirmarSenha" placeholder="Confirme a senha" required>
            </div>

            <div class="campo">
                <span class="icone"><i class="fa-solid fa-calendar"></i></span>
                <input type="date" id="dataNascimento" required>
            </div>

            <button type="submit" class="btn-primary">Cadastrar</button>

            <div id="mensagem"></div>
        </form>

        <p class="rodape-link">
            Já possui uma conta?
            <a href="./Login.html">Entrar</a>
        </p>
    </div>

    <script type="module" src="../js/pages/cadastro.js"></script>
</body>
</html>

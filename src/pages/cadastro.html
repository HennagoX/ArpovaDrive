<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprovaDrive - Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="/src/css/theme.css">
    <link rel="stylesheet" href="/src/css/styleCadastro.css">
    
</head>
<body>
    <div class="card">
        <!-- Alternador de Tema -->
        <div class="card-topo-acoes">
            <button class="vite-theme-switch" type="button" role="switch" aria-label="Alternar tema" title="Alternar entre Tema Dark e Modo Padrão">
                <span class="vite-switch-track">
                    <span class="vite-switch-thumb">
                        <svg class="icon-sun" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                        </svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                        </svg>
                    </span>
                </span>
                <span class="vite-switch-text">Dark</span>
            </button>
        </div>

        <!-- Indicador de Etapas -->
        <div class="etapas-cadastro" aria-label="Progresso do cadastro">
            <div class="etapa-item ativa" id="indicadorEtapa1">
                <span class="etapa-numero"><i class="fa-solid fa-user"></i></span>
                <div class="etapa-textos">
                    <span class="etapa-passo">Passo 1</span>
                    <span class="etapa-nome">Dados Pessoais</span>
                </div>
            </div>
            <div class="etapa-linha"></div>
            <div class="etapa-item" id="indicadorEtapa2">
                <span class="etapa-numero"><i class="fa-solid fa-shield-halved"></i></span>
                <div class="etapa-textos">
                    <span class="etapa-passo">Passo 2</span>
                    <span class="etapa-nome">Segurança</span>
                </div>
            </div>
        </div>

        <section id="secaoCadastro" class="auth-section">
            <div class="logo">
                <a href="/" aria-label="AprovaDrive">
                    <img src="/assets/logo.svg" alt="AprovaDrive" class="aprovadrive-logo" width="240" height="50">
                </a>
            </div>

            <h1>Crie sua conta</h1>
            <p class="subtitle">Preencha seus dados para iniciar a preparação para a CNH</p>

            <form id="formCadastro" novalidate>
                <div class="campo">
                    <label for="nome" class="campo-label">Nome completo</label>
                    <div class="campo-input-wrapper">
                        <span class="icone"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="nome" placeholder="Digite seu nome completo" required autocomplete="name">
                    </div>
                </div>

                <div class="campo">
                    <label for="email" class="campo-label">E-mail</label>
                    <div class="campo-input-wrapper">
                        <span class="icone"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
                    </div>
                </div>

                <div class="campo">
                    <label for="senhaCadastro" class="campo-label">Senha</label>
                    <div class="campo-input-wrapper">
                        <span class="icone"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="senhaCadastro" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                        <button type="button" class="mostrar-senha" id="toggleSenhaCadastro" aria-label="Alternar visibilidade da senha" title="Ver senha">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label for="confirmarSenha" class="campo-label">Confirmar senha</label>
                    <div class="campo-input-wrapper">
                        <span class="icone"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="confirmarSenha" placeholder="Repita a senha digitada" required autocomplete="new-password">
                        <button type="button" class="mostrar-senha" id="toggleConfirmarSenha" aria-label="Alternar visibilidade da senha" title="Ver senha">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="campo" id="campoData">
                    <label for="dataNascimento" class="campo-label">Data de nascimento</label>
                    <div class="campo-input-wrapper">
                        <span class="icone"><i class="fa-solid fa-calendar-days"></i></span>
                        <input type="date" id="dataNascimento" class="input-data-nascimento" required autocomplete="bday" aria-describedby="feedbackIdade">
                    </div>
                    <div id="feedbackIdade" class="campo-feedback" aria-live="polite"></div>
                </div>

                <button type="submit" class="btn-primary" id="btnContinuarCadastro">Continuar</button>

                <div id="mensagem"></div>
            </form>

            <p class="rodape-link">
                Já possui uma conta?
                <a href="/login">Entrar</a>
            </p>
        </section>

        <section id="secaoPergunta" class="auth-section" style="display: none;">
            <button type="button" class="btn-voltar" id="btnVoltarCadastro" aria-label="Voltar para os dados do cadastro" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <div class="logo">
                <a href="/" aria-label="AprovaDrive">
                    <img src="/assets/logo.svg" alt="AprovaDrive" class="aprovadrive-logo" width="240" height="50">
                </a>
            </div>

            <h1>Pergunta de segurança</h1>
            <p class="subtitle">Defina uma pergunta e resposta secreta para recuperar sua conta se esquecer sua senha.</p>

            <form id="formPerguntaSeguranca">
                <div class="campo">
                    <label for="perguntaSeguranca" class="campo-label">Selecione uma pergunta</label>
                    <div class="campo-input-wrapper campo-select">
                        <span class="icone"><i class="fa-solid fa-circle-question"></i></span>
                        <select id="perguntaSeguranca" required>
                            <option value="" disabled selected>Selecione uma pergunta de segurança</option>
                            <option value="Qual o nome do seu primeiro animal de estimação?">Qual o nome do seu primeiro animal de estimação?</option>
                            <option value="Qual é a sua cidade natal?">Qual é a sua cidade natal?</option>
                            <option value="Qual o nome da sua primeira escola?">Qual o nome da sua primeira escola?</option>
                            <option value="Qual o modelo do seu primeiro carro?">Qual o modelo do seu primeiro carro?</option>
                            <option value="Qual o sobrenome de solteira da sua mãe?">Qual o sobrenome de solteira da sua mãe?</option>
                            <option value="custom">Criar minha própria pergunta...</option>
                        </select>
                    </div>
                </div>

                <div class="campo" id="campoPerguntaCustom" style="display: none;">
                    <label for="perguntaCustom" class="campo-label">Sua pergunta personalizada</label>
                    <div class="campo-input-wrapper">
                        <span class="icone"><i class="fa-solid fa-pen"></i></span>
                        <input type="text" id="perguntaCustom" placeholder="Digite sua própria pergunta">
                    </div>
                </div>

                <div class="campo">
                    <label for="respostaSeguranca" class="campo-label">Sua resposta secreta</label>
                    <div class="campo-input-wrapper">
                        <span class="icone"><i class="fa-solid fa-shield-halved"></i></span>
                        <input type="text" id="respostaSeguranca" placeholder="Resposta de segurança" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="btnFinalizarCadastro">Concluir Cadastro</button>

                <div id="mensagemSeguranca"></div>
            </form>

            <p class="rodape-link">
                Já possui uma conta?
                <a href="/login">Entrar</a>
            </p>
        </section>
    </div>

    <script type="module" src="/src/js/pages/cadastro.js"></script>
</body>
</html>

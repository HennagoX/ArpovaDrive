<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprovaDrive - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="/src/css/theme.css">
    <link rel="stylesheet" href="/src/css/styleCadastro.css">
</head>
<body>
    <div class="card">
        <!-- SEÇÃO: LOGIN -->
        <section id="secaoLogin" class="auth-section">
            <div class="logo">
                <a href="/" aria-label="AprovaDrive">
                    <img src="/assets/logo.svg" alt="AprovaDrive" class="aprovadrive-logo" width="240" height="50">
                </a>
            </div>

            <h1>Login do Aluno</h1>
            <p class="subtitle">Entre na sua conta para continuar</p>

            <form id="formLogin">
                <div class="campo">
                    <span class="icone"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="usuario" placeholder="E-mail" required>
                </div>

                <div class="campo">
                    <span class="icone"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="senha" placeholder="Senha" required>
                    <button type="button" class="mostrar-senha" id="mostrarSenha" aria-label="Alternar visibilidade da senha"><span class="material-symbols-outlined">visibility</span></button>
                </div>

                <div class="opcoes">
                    <label class="lembrar">
                        <input type="checkbox" id="lembrar">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="esqueci" id="esqueci">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-primary" id="BotaoLogar">Entrar</button>

                <div id="mensagem"></div>
            </form>

            <div class="ou">
                <span>OU</span>
            </div>

            <button type="button" class="btn-google" id="google">
                <svg class="google-svg" width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Entrar com Google</span>
            </button>

            <p class="rodape-link">
                Ainda não tem uma conta?
                <a href="/cadastro">Cadastre-se</a>
            </p>
        </section>

        <!-- SEÇÃO: ESQUECI MINHA SENHA -->
        <section id="secaoEsqueci" class="auth-section" style="display: none;">
            <button type="button" class="btn-voltar" id="btnVoltarLogin" aria-label="Voltar para o login" title="Voltar para o login">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <div class="logo">
                <a href="/" aria-label="AprovaDrive">
                    <img src="/assets/logo.svg" alt="AprovaDrive" class="aprovadrive-logo" width="240" height="50">
                </a>
            </div>

            <h1>Esqueci minha senha</h1>
            <p class="subtitle">Digite seu e-mail para receber as instruções de redefinição de senha.</p>

            <form id="formEsqueci">
                <div class="campo">
                    <span class="icone"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="recuperarEmail" placeholder="E-mail" required>
                </div>

                <div class="campo">
                    <span class="icone"><i class="fa-solid fa-shield-halved"></i></span>
                    <input type="text" id="recuperarResposta" placeholder="Resposta de segurança" required>
                </div>

                <button type="submit" class="btn-primary" id="btnEnviarInstrucoes">Enviar instruções</button>

                <div id="mensagemEsqueci"></div>
            </form>

            <div class="ou">
                <span>OU</span>
            </div>

            <button type="button" class="btn-google" id="googleRecuperar">
                <svg class="google-svg" width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Recuperar com Google</span>
            </button>

            <p class="rodape-link">
                Lembrou sua senha?
                <a href="#" id="linkVoltarLogin">Voltar para o login</a>
            </p>
        </section>
    </div>

    <script type="module" src="/src/js/pages/login.js"></script>
</body>
</html>

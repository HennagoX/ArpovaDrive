<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprovaDrive - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/utils.css">
    <link rel="stylesheet" href="../css/styleCadastro.css">
</head>
<body>
    <div class="card">
        <div class="logo">
            <span class="logo-a">A</span><span class="logo-aprova">prova</span><span class="logo-drive">Drive</span>
        </div>

        <h1>Login do Aluno</h1>
        <p class="subtitle">Entre na sua conta para continuar</p>

        <form id="formLogin">
            <div class="campo">
                <span class="icone"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="usuario" placeholder="E-mail ou CPF" required>
            </div>

            <div class="campo">
                <span class="icone"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="senha" placeholder="Senha" required>
                <button type="button" class="mostrar-senha" id="mostrarSenha" aria-label="Alternar visibilidade da senha"><span class="material-symbols-outlined">visibility</span></button>
            </div>

            <div class="opcoes">
                <label class="lembrar">
                    <input type="checkbox" id="lembrar">
                    <span>Lembrar-me</span>
                </label>
                <a href="#" class="esqueci" id="esqueci">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn-primary" id="BotaoLogar">Entrar</button>

            <div id="mensagem"></div>
        </form>

        <div class="ou">
            <span>OU</span>
        </div>

        <button type="button" class="btn-google" id="google">
            <span class="google">G</span>
            <span>Entrar com Google</span>
        </button>

        <p class="rodape-link">
            Ainda não tem uma conta?
            <a href="./cadastro.html">Cadastre-se</a>
        </p>
    </div>

    <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
